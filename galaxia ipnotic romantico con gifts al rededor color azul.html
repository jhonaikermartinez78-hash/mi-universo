            position: fixed;
            top: 0; left: 0;

            z-index: 30;
            pointer-events: none;
        }
        .avatar-shell {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 30;
            width: 90px;
            height: 90px;
            border-radius: 50%;
        }
        .avatar-sphere {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,105,180,0.6), rgba(204,0,34,0.2));
            box-shadow: 0 0 40px rgba(204,0,34,0.7), 0 0 20px rgba(255,105,180,0.3) inset;
            border: 2px solid rgba(255,255,255,0.15);
        }
        .avatar-gif {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            border-radius: 50%;
            object-fit: cover;
            border: none;
        }
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);

        #modal-overlay.active { opacity: 1; pointer-events: auto; }
        #modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-content img {
            width: 100%; border-radius: 15px; margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);

        #typewriter-text {

            z-index: 10; pointer-events: none; opacity: 0; transition: opacity 2s;

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(204, 0, 34, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createGlowTexture();

        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 70000;

            starsSizes[i] = 1.0 + Math.random() * 3.5;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(starsCol, 3));
        starsGeo.setAttribute('size', new THREE.BufferAttribute(starsSizes, 1));
        const starsMat = new THREE.PointsMaterial({
            size: 2.2,
            vertexColors: true,
            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true

        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        const spiralGeo = new THREE.BufferGeometry();

        const tunnelGeo = new THREE.BufferGeometry();
        const tunnelCount = 18000;

        tunnelGeo.setAttribute('position', new THREE.BufferAttribute(tunnelPos, 3));

        const heartGroup = new THREE.Group();

        finalGroup.add(heartGroup);

        const heartGeo = new THREE.BufferGeometry();
        const heartCount = 55000;
        const heartPos = new Float32Array(heartCount * 3);
        for(let i=0; i<heartCount; i++) {

        heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));

            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false,
            opacity: 0.95
        });
        const heartPoints = new THREE.Points(heartGeo, heartMat);
        heartPoints.renderOrder = 999;
        heartGroup.add(heartPoints);

        const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: particleTexture,
            color: 0xcc0022,

            blending: THREE.AdditiveBlending,

            depthTest: false
        }));
        glowSprite.scale.set(18, 18, 1);
        glowSprite.position.set(0, 0, 0);
        glowSprite.renderOrder = 999;
        heartGroup.add(glowSprite);

        const galaxyGroup = new THREE.Group();
        galaxyGroup.position.set(0, -3, 0);
        galaxyGroup.scale.set(0, 0, 0);
        finalGroup.add(galaxyGroup);

        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyCount = 80000;
        const galPos = new Float32Array(galaxyCount * 3);
        const galCol = new Float32Array(galaxyCount * 3);
        for(let i=0; i<galaxyCount; i++) {
            const radius = Math.pow(Math.random(), 2.5) * 45 + 3;

            galCol[i*3] = color.r; galCol[i*3+1] = color.g; galCol[i*3+2] = color.b;
        }
        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galPos, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galCol, 3));
        galaxyGroup.add(new THREE.Points(galaxyGeo, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, map: particleTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

        const spritesGroup = new THREE.Group();
        spritesGroup.renderOrder = 0;
        finalGroup.add(spritesGroup);
        const allSprites = [];
        const avatarMarkers = [];

        const avatarData = [
            { url: "https://bcstorage.bcode.me/index.php?proxy_url=https%3A%2F%2Ff005.backblazeb2.com%2Ffile%2Fbcodestorage%2FBCDetallesPro_Enpoind%252Ftemp_upload_1787006359497.jpeg", text: "Tú me haces ronronear el corazón ❤️" },
            { url: "https://bcstorage.bcode.me/index.php?proxy_url=https%3A%2F%2Ff005.backblazeb2.com%2Ffile%2Fbcodestorage%2FBCDetallesPro_Enpoind%252Ftemp_upload_1787006327438.jpeg", text: "¿Me das el honor de estar siempre a tu lado? ✨" },
            { url: "https://bcstorage.bcode.me/index.php?proxy_url=https%3A%2F%2Ff005.backblazeb2.com%2Ffile%2Fbcodestorage%2FBCDetallesPro_Enpoind%252Ftemp_upload_1787006422215.jpeg", text: "Mi lugar favorito en el mundo es contigo." },
            { url: "https://bcstorage.bcode.me/index.php?proxy_url=https%3A%2F%2Ff005.backblazeb2.com%2Ffile%2Fbcodestorage%2FBCDetallesPro_Enpoind%252Ftemp_upload_1787006533219.jpeg", text: "Eres la casualidad más hermosa." },
            { url: "https://bcstorage.bcode.me/index.php?proxy_url=https%3A%2F%2Ff005.backblazeb2.com%2Ffile%2Fbcodestorage%2FBCDetallesPro_Enpoind%252Ftemp_upload_1787006569366.jpeg", text: "¿Quieres ser la dueña de mi corazón?" },
            { url: "https://bcstorage.bcode.me/index.php?proxy_url=https%3A%2F%2Ff005.backblazeb2.com%2Ffile%2Fbcodestorage%2FBCDetallesPro_Enpoind%252Ftemp_upload_1787006594651.jpeg", text: "Dime que sí y prometo hacerte sonreír siempre." }
        ];

        const avatarOverlay = document.getElementById('avatar-overlay');
        avatarData.forEach((data, index) => {
            const marker = new THREE.Object3D();
            const angle = (index / avatarData.length) * Math.PI * 2;
            const radius = 18;
            marker.userData = {
                targetPos: new THREE.Vector3(Math.cos(angle) * radius, -2 + (Math.random() - 0.5) * 3, Math.sin(angle) * radius),
                active: false,
                gifUrl: data.url,
                phrase: data.text
            };
            marker.position.set(0, 5, 0);
            spritesGroup.add(marker);
            avatarMarkers.push(marker);
            allSprites.push(marker);

            const shell = document.createElement('div');

            shell.dataset.index = index;
            shell.innerHTML = `
                <div class="avatar-sphere"></div>
                <img class="avatar-gif" src="${data.url}" alt="avatar">
            `;
            avatarOverlay.appendChild(shell);
            marker.userData.htmlElement = shell;
        });

        const palabras = [
            "MI CORAZÓN ES TUYO", "CONTIGO SIEMPRE", "INFINITO ∞", "ERES MI TODO", "MAGIA",
            "AMOR ETERNO", "ME HACES FELIZ", "PRECIOSA", "ÚNICA", "MI VIDA", "TE AMO", "SÍ"
        ];
        for(let i=0; i<30; i++) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 128);
            ctx.font = "bold 40px 'Montserrat', sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.shadowColor = "#cc0022";
            ctx.shadowBlur = 30;
            ctx.fillStyle = "#ffffff";
            ctx.fillText(palabras[Math.floor(Math.random() * palabras.length)], 256, 64);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
            spr.scale.set(12, 3, 1);
            spr.renderOrder = 0;
            const radius = 8 + Math.random() * 16;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            spr.userData = {
                targetPos: new THREE.Vector3(radius * Math.sin(phi) * Math.cos(theta), -4 + (Math.random() - 0.5) * 5, radius * Math.sin(phi) * Math.sin(theta)),
                type: 'text',
                active: false
            };
            spr.position.set(0, 5, 0);
            spritesGroup.add(spr);
            allSprites.push(spr);
        }

        let typeInterval;
        function startTypewriter(text) {
            const container = document.getElementById('typewriter-text');
            container.innerHTML = "";
            let i = 0;
            clearInterval(typeInterval);
            typeInterval = setInterval(() => {
                if(i < text.length) {
                    container.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typeInterval);
                }
            }, 60);
        }

        avatarOverlay.addEventListener('click', (e) => {
            if(phase < 4) return;
            const shell = e.target.closest('.avatar-shell');
            if(!shell) return;
            const index = parseInt(shell.dataset.index);
            const marker = avatarMarkers[index];
            if(marker && marker.userData.phrase) {
                document.getElementById('modal-img').src = marker.userData.gifUrl;
                document.getElementById('modal-overlay').classList.add('active');
                startTypewriter(marker.userData.phrase);
            }
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('modal-overlay').classList.remove('active');
            clearInterval(typeInterval);
        });

        const clock = new THREE.Clock();
        let heartScaleTarget = 0;
        let galaxyScaleTarget = 0;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animar() {
            requestAnimationFrame(animar);
            const time = clock.getElapsedTime();

            if(phase === 1) {
                camera.position.z -= 3.0;
                tunnel.rotation.z += 0.015;
                if(camera.position.z <= 60) {
                    phase = 2; tunnel.visible = false;
                    camera.position.set(0, 4, 30);
                    controls.target.set(0, 3, 0);
                    controls.autoRotate = true;
                    heartScaleTarget = 0.75;
                    setTimeout(() => { phase = 3; galaxyScaleTarget = 0.7; }, 2000);
                    setTimeout(() => {
                        phase = 4;
                        avatarMarkers.forEach(m => m.userData.active = true);
                        document.getElementById('hint').style.opacity = '1';
                    }, 4000);
                    setTimeout(() => {
                        phase = 5;
                        allSprites.forEach(s => { if(s.userData.type === 'text') s.userData.active = true; });
                    }, 5500);
                }
            }

            if(phase >= 2) {
                controls.update();

                allSprites.forEach(obj => {
                    if(obj.userData.active && obj.userData.htmlElement) {
                        const el = obj.userData.htmlElement;
                        const worldPos = obj.position.clone();
                        const dist = camera.position.distanceTo(worldPos);
                        const baseSize = 90;
                        const refDist = 30;
                        let scale = (refDist / dist) * 1.2;
                        scale = Math.min(Math.max(scale, 0.7), 2.0);
                        el.style.width = (baseSize * scale) + 'px';
                        el.style.height = (baseSize * scale) + 'px';
                    }
                });

                if(heartGroup.scale.x < heartScaleTarget) {
                    heartGroup.scale.lerp(new THREE.Vector3(heartScaleTarget, heartScaleTarget, heartScaleTarget), 0.04);
                } else if(heartScaleTarget > 0) {
                    const pulse = 1.0 + Math.sin(time * 4) * 0.04;
                    heartGroup.scale.set(pulse * 0.75, pulse * 0.75, pulse * 0.75);
                }
                if(galaxyGroup.scale.x < galaxyScaleTarget) {
                    galaxyGroup.scale.lerp(new THREE.Vector3(galaxyScaleTarget, galaxyScaleTarget, galaxyScaleTarget), 0.02);
                }
                galaxyGroup.rotation.y = time * 0.06;
                stars.rotation.y = time * 0.002;
                stars.rotation.x = time * 0.001;
                spiral.rotation.y = time * 0.015;
                spiral.rotation.x = time * 0.005;
                tunnel.rotation.z += 0.01;

                allSprites.forEach(obj => {
                    if(obj.userData.active) {
                        if(obj.type === 'Sprite') {
                            obj.material.opacity = Math.min(obj.material.opacity + 0.03, 1);
                            obj.position.lerp(obj.userData.targetPos, 0.035);
                            if(obj.position.distanceTo(obj.userData.targetPos) < 2) {
                                obj.position.y += Math.sin(time * 2 + obj.id) * 0.03;
                            }
                        } else if(obj.isObject3D && obj.userData.htmlElement) {
                            obj.position.lerp(obj.userData.targetPos, 0.035);
                            if(obj.position.distanceTo(obj.userData.targetPos) < 2) {
                                obj.position.y += Math.sin(time * 2 + obj.id) * 0.03;
                            }
                            const worldPos = obj.position.clone();
                            const projected = worldPos.project(camera);
                            const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                            const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
                            const el = obj.userData.htmlElement;
                            el.style.left = x + 'px';
                            el.style.top = y + 'px';
                            el.style.opacity = Math.min(parseFloat(el.style.opacity) + 0.03, 1);
                        }
                    }
                });
            }
            renderer.render(scene, camera);
        }
        animar();
    </script>
</body>
</html>
